name: Weekly Laptop Crawler

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    
    # Ép tất cả các bước chạy bên dưới phải đứng ở thư mục crawler
    defaults:
      run:
        working-directory: ./crawler

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # Bật lại cache mượt mà bằng cách chỉ rõ đường dẫn file
          cache-dependency-path: 'crawler/requirements-crawler.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r crawler/requirements-crawler.txt

      - name: Run Scrapy Crawler
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          scrapy crawl chotot_laptop -s CLOSESPIDER_PAGECOUNT=10